name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - name: Lint and format
        run: bunx biome ci

      - name: Type check
        run: |
          for pkg in apps/lab/app apps/lab/server apps/manager/cli apps/manager/server; do
            echo "::group::$pkg"
            (cd "$pkg" && bunx tsc --noEmit)
            echo "::endgroup::"
          done

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
