name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bunx biome ci
      - run: for pkg in apps/lab/app apps/lab/server apps/manager/cli apps/manager/server; do (cd "$pkg" && bunx tsc --noEmit); done
      - run: bun run test
      - run: bun run build
