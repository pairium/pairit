name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A normal run takes about a minute. Without a limit, a stuck test holds a
    # deploy (deploy.yml runs this first) for GitHub's default of 6 hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bunx biome ci
      - run: for pkg in apps/lab/app apps/lab/server apps/manager/cli apps/manager/server; do (cd "$pkg" && bunx tsc --noEmit); done
      - run: bun run test
      - run: bun run build
