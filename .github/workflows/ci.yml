name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to check (default is the triggering commit)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - name: Lint and format
        run: bunx biome ci

      - name: Type check
        run: |
          for pkg in apps/lab/app apps/lab/server apps/manager/cli apps/manager/server; do
            echo "::group::$pkg"
            (cd "$pkg" && bunx tsc --noEmit)
            echo "::endgroup::"
          done

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
