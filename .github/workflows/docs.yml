name: Docs

# Docs publish with each production deploy (deploy.yml calls this), so they
# match what production runs. Run by hand only to republish.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or full commit SHA (blank = latest main)
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install MkDocs and theme
        run: pip install mkdocs mkdocs-shadcn pymdown-extensions pygments

      - name: Build docs
        run: mkdocs build -f mkdocs.yml -d site/pairit
        working-directory: docs

      - name: Add custom domain and root redirect
        run: |
          printf 'docs.pairium.ai\n' > docs/site/CNAME
          cp docs/root/index.html docs/site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
