name: Docs

# Docs publish with each production deploy (deploy.yml calls this), so they
# match what production runs. Run by hand only to republish, from main.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or full commit SHA on main (blank = latest main)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A called workflow sees the caller's ref, so this holds for deploy.yml too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Check the ref with the script from main before checking it out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          SHA=$(bash scripts/resolve-deploy-ref.sh "$REF")
          echo "Building docs from $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install MkDocs and theme from docs/uv.lock
        run: uv sync --frozen
        working-directory: docs

      - name: Build docs
        run: uv run --frozen mkdocs build -f mkdocs.yml -d site/pairit
        working-directory: docs

      - name: Add custom domain and root redirect
        run: |
          printf 'docs.pairium.ai\n' > docs/site/CNAME
          cp docs/root/index.html docs/site/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
