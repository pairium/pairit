name: Deploy

# Push to main deploys staging when the repo variable STAGING_AUTO_DEPLOY is "true".
# Production deploys only by hand. Setup: docs/docs/dev/deployment.md.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: Tag or full commit SHA (blank = latest main)
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref }}

  deploy:
    needs: ci
    if: >-
      (github.event_name == 'push' && vars.STAGING_AUTO_DEPLOY == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'staging' }}
    concurrency: deploy-${{ inputs.target || 'staging' }}
    env:
      TARGET: ${{ inputs.target || 'staging' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: printf '%s\n' "$ENV_FILE" > ".env.$TARGET"
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
      - run: bash scripts/deploy.sh "$TARGET"
      - run: bash scripts/tests/verify-health.sh "${{ vars.LAB_URL }}" "${{ vars.MANAGER_URL }}"
