name: Deploy

# Push to main deploys staging when the repo variable STAGING_AUTO_DEPLOY is "true".
# Production deploys only by hand, then publishes the docs from the same ref. Setup: docs/docs/dev/deployment.md.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: Tag or full commit SHA on main (blank = latest main)
        type: string
        default: ''
      force:
        description: Production only. Skip the live-study check (emergency override or when ADMIN_ACTIVITY_TOKEN is not configured).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Turns the ref into a commit SHA on main, using the script from main. Later
  # jobs check out only that SHA, so no deploy runs unmerged code.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: ref
        env:
          REF: ${{ inputs.ref || github.sha }}
        run: |
          SHA=$(bash scripts/resolve-deploy-ref.sh "$REF")
          echo "Deploying $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  ci:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  deploy:
    needs: [resolve, ci]
    if: >-
      (github.event_name == 'push' && vars.STAGING_AUTO_DEPLOY == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Only this job can get a GitHub OIDC token. Its subject names the
    # environment, which is what Google trusts (docs/docs/dev/deployment.md).
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.target || 'staging' }}
    concurrency: deploy-${{ inputs.target || 'staging' }}
    env:
      TARGET: ${{ inputs.target || 'staging' }}
      DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      # Check production for active participants before deploying. Uses the
      # read-only ADMIN_ACTIVITY_TOKEN secret; force=true skips the check.
      - name: Live-study check
        if: env.TARGET == 'production' && !inputs.force
        env:
          MANAGER_URL: ${{ vars.MANAGER_URL }}
          ADMIN_ACTIVITY_TOKEN: ${{ secrets.ADMIN_ACTIVITY_TOKEN }}
        run: |
          if [ -z "$ADMIN_ACTIVITY_TOKEN" ]; then
            echo "::error title=Live-study check not configured::ADMIN_ACTIVITY_TOKEN is not set in the production environment secrets. Configure it (see docs/docs/dev/deployment.md), or run 'pairit admin activity' yourself and re-run with force=true."
            exit 1
          fi
          BODY_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$BODY_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $ADMIN_ACTIVITY_TOKEN" \
            "${MANAGER_URL%/}/admin/activity")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error title=Live-study check failed::GET /admin/activity returned HTTP $HTTP_CODE"
            cat "$BODY_FILE"
            rm -f "$BODY_FILE"
            exit 1
          fi
          bun -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const live = Array.isArray(report.liveStudies)
              ? report.liveStudies
              : (report.configs ?? []).filter((c) => (c.activeNow?.total ?? 0) > 0);
            if (live.length === 0) {
              console.log("✅ No study is live.");
              process.exit(0);
            }
            console.log(`::error title=Live studies active::${live.length} ${live.length === 1 ? "study is" : "studies are"} live. Wait until participants finish, or re-run with force=true.`);
            for (const s of live) {
              const owner = s.ownerEmail ?? s.ownerId ?? "-";
              const kind = s.isGroupStudy ? `${s.activeNow.inGroup} in group, ${s.activeNow.solo} solo` : "solo";
              console.log(`  - ${s.configId} (${owner}): ${s.activeNow.total} active (${kind})`);
            }
            process.exit(1);
          ' "$BODY_FILE"
          rm -f "$BODY_FILE"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      # Mask each secret value on its own: GitHub masks the whole ENV_FILE
      # secret, not a single value from it that a tool might print.
      - name: Write env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          while IFS= read -r line; do
            line="${line%$'\r'}"
            if [[ "$line" =~ ^[[:space:]]*(export[[:space:]]+)?([A-Z][A-Z0-9_]*)[[:space:]]*=[[:space:]]*(.*)$ ]]; then
              key="${BASH_REMATCH[2]}"
              value="${BASH_REMATCH[3]}"
              value="${value#\"}"; value="${value%\"}"; value="${value#\'}"; value="${value%\'}"
              if [[ "$key" =~ (SECRET|KEY|TOKEN|PASSWORD|CREDENTIAL|URI) ]] && [ -n "$value" ]; then
                echo "::add-mask::$value"
              fi
            fi
          done <<< "$ENV_FILE"
          umask 077
          printf '%s\n' "$ENV_FILE" > ".env.$TARGET"
      - run: bash scripts/deploy.sh "$TARGET"
        env:
          # Actions ran the Live-study check step above (or force=true skipped it)
          # and does not have an interactive CLI login for deploy.sh.
          FORCE_DEPLOY: ${{ env.TARGET == 'production' && '1' || '' }}
      - run: bash scripts/tests/verify-health.sh "$LAB_URL" "$MANAGER_URL"
        env:
          LAB_URL: ${{ vars.LAB_URL }}
          MANAGER_URL: ${{ vars.MANAGER_URL }}
      - name: Remove env file
        if: always()
        run: rm -f ".env.$TARGET"

  docs:
    needs: [resolve, deploy]
    if: inputs.target == 'production'
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
