name: Deploy

# Push to main deploys staging when the repo variable STAGING_AUTO_DEPLOY is "true".
# Production deploys only by hand, then publishes the docs from the same ref. Setup: docs/docs/dev/deployment.md.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: Tag or full commit SHA (blank = latest main)
        type: string
        default: ''
      force:
        description: Production only. I checked `pairit admin activity` and no group study is live.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref }}

  deploy:
    needs: ci
    if: >-
      (github.event_name == 'push' && vars.STAGING_AUTO_DEPLOY == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'staging' }}
    concurrency: deploy-${{ inputs.target || 'staging' }}
    env:
      TARGET: ${{ inputs.target || 'staging' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: printf '%s\n' "$ENV_FILE" > ".env.$TARGET"
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
      # deploy.sh checks for live group studies with an admin CLI login, which
      # Actions does not have. Until there is a service credential, warn instead.
      - name: Live-study check
        if: env.TARGET == 'production' && !inputs.force
        run: |
          echo "::warning title=Live-study check not run::Actions has no admin login for the manager API, so it cannot check for live group studies. Run 'pairit admin activity' before a production deploy, and pass force=true once you have. See docs/docs/dev/deployment.md."
      - run: bash scripts/deploy.sh "$TARGET"
        env:
          # The step above stands in for deploy.sh's check
          FORCE_DEPLOY: '1'
      - run: bash scripts/tests/verify-health.sh "${{ vars.LAB_URL }}" "${{ vars.MANAGER_URL }}"

  docs:
    needs: deploy
    if: inputs.target == 'production'
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ inputs.ref }}
    permissions:
      contents: read
      pages: write
      id-token: write
