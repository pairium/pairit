schema_version: 0.1.0
allowRetake: true
requireAuth: false
initialPageId: intro

pages:
  - id: intro
    components:
      - type: text
        props:
          text: |
            # Split layout demo

            You will negotiate the price of a used car with an AI dealer.
            The listing stays on screen next to the chat.
      - type: buttons
        props:
          buttons:
            - id: start
              text: "Start negotiation"
              action:
                type: go_to
                target: negotiate

  - id: negotiate
    layout: split
    components:
      - type: chat
        column: left
        props:
          agents:
            - dealer
      - type: html
        id: listing
        column: right
        props:
          src: split-demo/listing.html
          height: 320
      - type: buttons
        props:
          buttons:
            - id: end_chat
              text: "End negotiation"
              action:
                type: go_to
                target: thanks

  - id: thanks
    end: true
    components:
      - type: text
        props:
          text: "Thank you for participating!"

agents:
  - id: dealer
    model: "gpt-6-luna"
    reasoningEffort: low
    avatar:
      icon: badge-dollar-sign
    system: |
      You are a used car dealer selling a 2019 Honda Civic with 45,000 miles.
      Reserve price: $12,000 (won't sell below). Starting ask: $18,000.
      Be friendly but firm. Keep responses SHORT - 1-2 sentences max.
